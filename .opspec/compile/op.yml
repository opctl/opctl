name: compile
description: runs ops necessary to go from src to releasable artifact(s)
inputs:
  version:
    string:
      constraints:
        format: semver
  HOME:
    dir:
      description: Home directory of caller; used to access go modules
  sdkSum:
    string:
      description: go.sum hash of the Go op SDK release matching version; empty for builds without a published SDK
      default: ''
  sdkGoModSum:
    string:
      description: go.sum hash of the Go op SDK release's go.mod; empty for builds without a published SDK
      default: ''
run:
  serial:
    - op:
        ref: $(../../webapp/.opspec/compile)
    - op:
        ref: $(../../cli/.opspec/compile)
        inputs:
          HOME:
          version:
          sdkSum:
          sdkGoModSum:

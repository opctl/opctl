name: missing-member
run:
  serial:
    - container:
        image: {ref: alpine:3}
        outputs: {version: $(version)}
        cmd: [sh, -ce, "printf '%s' '{\"other\":1}' > \"$OPCTL_OUTPUTS\""]
    - container:
        image: {ref: alpine:3}
        cmd: [sh, -ce, "echo CONSUMER_SHOULD_NOT_RUN; exit 99"]

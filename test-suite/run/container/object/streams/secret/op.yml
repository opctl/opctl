name: yaml-secret-stream
outputs:
  token: {string: {isSecret: true}}
run:
  serial:
    - op:
        ref: ./child
        outputs: {source: $(token)}
    - serialLoop:
        range: [first, second]
        run:
          parallel:
            - container:
                image: {ref: alpine:3}
                envVars: {TOKEN: $(token)}
                cmd: [sh, -ce, 'test "${#TOKEN}" = 32']
            - container:
                image: {ref: alpine:3}
                envVars: {TOKEN: $(token)}
                cmd: [sh, -ce, 'test "${#TOKEN}" = 32']

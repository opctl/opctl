name: typed-generated-secret
outputs:
  token: {string: {}}
  metadata: {object: {}}
run:
  serial:
    - parallel:
        - container:
            image: {ref: alpine:3}
            outputs: {token: $(token), metadata: $(metadata)}
            outputParams:
              token: {string: {isSecret: true}}
              metadata:
                object:
                  isSecret: true
                  constraints:
                    properties: {revision: {type: string}}
                    required: [revision]
            cmd:
              - sh
              - -ce
              - |
                token=`printf '%032d' 42`
                printf '{"token":"%s","metadata":{"revision":"%s"}}' "$token" "$token" > "$OPCTL_OUTPUTS"
        - container:
            image: {ref: alpine:3}
            cmd: ["true"]
    - op:
        ref: ./relay
        inputs: {token: $(token), metadata: $(metadata)}
        outputs: {token: $(renamed), metadata: $(details)}
    - parallel:
        - container:
            image: {ref: alpine:3}
            envVars: {TOKEN: $(renamed), METADATA: $(details)}
            cmd: [sh, -ce, "expected=`printf '%032d' 42`; test \"$TOKEN\" = \"$expected\"; test \"$METADATA\" = \"{\\\"revision\\\":\\\"$expected\\\"}\""]
        - container:
            image: {ref: alpine:3}
            envVars: {TOKEN: $(renamed), METADATA: $(details)}
            cmd: [sh, -ce, "expected=`printf '%032d' 42`; test \"$TOKEN\" = \"$expected\"; test \"$METADATA\" = \"{\\\"revision\\\":\\\"$expected\\\"}\""]
    - container:
        image: {ref: alpine:3}
        envVars: {TOKEN: $(renamed), METADATA: $(details)}
        cmd: [sh, -ce, "expected=`printf '%032d' 42`; test \"$TOKEN\" = \"$expected\"; test \"$METADATA\" = \"{\\\"revision\\\":\\\"$expected\\\"}\""]

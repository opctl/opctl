name: typed-secret-relay
inputs:
  token: {string: {}}
  metadata: {object: {}}
outputs:
  token: {string: {}}
  metadata: {object: {}}
run:
  container:
    image: {ref: alpine:3}
    outputs: {token: $(token), metadata: $(metadata)}
    envVars: {TOKEN: $(token), METADATA: $(metadata)}
    cmd: [sh, -ce, "expected=`printf '%032d' 42`; test \"$TOKEN\" = \"$expected\"; test \"$METADATA\" = \"{\\\"revision\\\":\\\"$expected\\\"}\"; printf '{\"token\":\"%s\",\"metadata\":%s}' \"$TOKEN\" \"$METADATA\" > \"$OPCTL_OUTPUTS\""]
